<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f0f2f5">
<title>MotoAsistente — Personalizar mi moto</title>
<style>
:root{--bg:#f0f2f5;--surface:#fff;--surface2:#f7f8fa;--border:#e2e5ea;--text:#1a1e2a;--text2:#555;--text3:#999;--brand:#E8580A;--ok:#2d9b5a;--warn:#d4850a;--crit:#cc3333;--nav-h:56px;--header-h:44px}
[data-theme="dark"]{--bg:#0a0a14;--surface:#12122a;--surface2:#1a1a34;--border:#2a2a4a;--text:#f0f0f5;--text2:#a0a0b8;--text3:#666}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
#app{height:100%;display:flex;flex-direction:column}

.header{height:var(--header-h);display:flex;align-items:center;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);z-index:50}
.logo{font-weight:900;font-size:13px}.logo span{color:var(--brand)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-btn{padding:5px 10px;border:1px solid var(--border);background:var(--surface2);border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;color:var(--text2)}
.hdr-btn:hover{border-color:var(--brand);color:var(--brand)}

#viewer3d{flex:1;position:relative;background:#e4e7ec}
[data-theme="dark"] #viewer3d{background:#0d0d1a}
#viewer3d canvas{display:block;width:100%;height:100%}

/* Side icons for parts */
.icons-col{position:absolute;top:0;bottom:0;width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10;padding:10px 0}
.icons-col.left{left:8px}
.icons-col.right{right:8px}

.ic-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .1s}
.ic-btn:active{transform:scale(.88)}
.ic-label{font-size:8px;font-weight:700;color:var(--text3);text-align:center;max-width:60px;order:-1}

.ic-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.88);backdrop-filter:blur(4px);border:2.5px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.12);transition:border-color .15s}
[data-theme="dark"] .ic-circle{background:rgba(20,20,40,.85)}
.ic-circle svg{width:26px;height:26px;stroke-width:2}
.ic-circle.selected{border-color:var(--brand);box-shadow:0 0 12px rgba(232,88,10,.3)}

/* Color picker - centered horizontal strip */
.color-picker{position:absolute;z-index:20;left:50%;bottom:60px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:6px 12px;box-shadow:0 4px 20px rgba(0,0,0,.2);display:none;align-items:center;gap:8px}
.color-picker.open{display:flex}
.cp-label{font-size:9px;font-weight:700;color:var(--text3);white-space:nowrap;margin-right:4px}
.cp-color{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s,border-color .12s}
.cp-color:hover{transform:scale(1.15)}.cp-color.active{border-color:var(--text);transform:scale(1.1);box-shadow:0 0 8px rgba(0,0,0,.2)}
.cp-close{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;margin-left:4px}

/* Style toggle at bottom of viewer */
.style-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border-radius:16px;padding:4px 8px;border:1px solid var(--border)}
[data-theme="dark"] .style-bar{background:rgba(20,20,40,.8)}
.sb-btn{padding:4px 10px;border:none;border-radius:12px;font-size:10px;font-weight:700;cursor:pointer;background:transparent;color:var(--text2)}
.sb-btn.on{background:var(--brand);color:#fff}

/* Footer */
.footer{height:var(--nav-h);display:flex;align-items:center;justify-content:center;gap:12px;background:var(--surface);border-top:1px solid var(--border);padding:0 16px}
.ft-btn{padding:8px 16px;border:1px solid var(--border);background:var(--surface2);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text2)}
.ft-btn:hover{border-color:var(--brand);color:var(--brand)}
.ft-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}

#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface2);z-index:20}
#loading.done{display:none}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p{margin-top:6px;font-size:10px;color:var(--text2)}
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="logo">MOTO<span>ASISTENTE</span> · Personalizar</div>
    <div class="hdr-right">
      <button class="hdr-btn" onclick="toggleTheme()">🌓 Tema</button>
      <button class="hdr-btn" onclick="window.location='index.html'">← Volver</button>
    </div>
  </header>

  <div id="viewer3d">
    <div id="loading"><div class="spin"></div><p id="loadPct">Cargando...</p></div>
    <div class="icons-col left" id="icL"></div>
    <div class="icons-col right" id="icR"></div>
    <div class="style-bar">
      <button class="sb-btn on" id="sbWire" onclick="setStyle(0)">Wireframe</button>
      <button class="sb-btn" id="sbFlat" onclick="setStyle(1)">Flat</button>
    </div>
    <div class="color-picker" id="picker"></div>
  </div>

  <div class="footer">
    <button class="ft-btn" onclick="resetAll()">⟳ Reset</button>
    <button class="ft-btn primary" onclick="saveAndBack()">💾 Guardar y volver</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

// ═══ ZONES (bounding boxes) ═══
const ZONES = [
  { id:'manubrio', name:'Manubrio', icon:'handlebar', side:'left',
    cx:0, cy:1.10, cz:0.60, w:0.75, h:0.40, d:0.35, color:'#7799bb',
    palette:['#88aacc','#aabbdd','#ccddee','#778899','#5577aa','#335588'] },
  { id:'tanque', name:'Tanque', icon:'fuel', side:'left',
    cx:0, cy:0.85, cz:0.20, w:0.45, h:0.35, d:0.45, color:'#3377aa',
    palette:['#3377aa','#cc3333','#33aa55','#E8580A','#5533aa','#eeeeee'] },
  { id:'rueda_del', name:'Rueda Del.', icon:'wheel', side:'left',
    cx:0, cy:0.30, cz:0.75, w:0.25, h:0.60, d:0.60, color:'#2a2a30',
    palette:['#1a1a20','#2a2a30','#333340','#444455','#222233','#111118'] },
  { id:'motor', name:'Motor', icon:'engine', side:'right',
    cx:0, cy:0.45, cz:0.00, w:0.45, h:0.45, d:0.50, color:'#444450',
    palette:['#333340','#444450','#555566','#3a3a44','#2a2a33','#666677'] },
  { id:'asiento', name:'Asiento', icon:'seat', side:'right',
    cx:0, cy:0.80, cz:-0.30, w:0.40, h:0.30, d:0.50, color:'#1a1a24',
    palette:['#111118','#1a1a24','#2a2233','#332222','#1a2a1a','#222222'] },
  { id:'rueda_tra', name:'Rueda Tras.', icon:'wheel', side:'right',
    cx:0, cy:0.30, cz:-0.75, w:0.25, h:0.60, d:0.60, color:'#2a2a30',
    palette:['#1a1a20','#2a2a30','#333340','#444455','#222233','#111118'] },
];
let chasisColor = '#556677';
const CHASIS_PALETTE = ['#556677','#4477aa','#cc3333','#33aa55','#E8580A','#eeeeee'];
const DEFAULT_COLORS = { manubrio:'#7799bb', tanque:'#3377aa', rueda_del:'#2a2a30', motor:'#444450', asiento:'#1a1a24', rueda_tra:'#2a2a30', chasis:'#556677' };

const PALETTE = null; // palettes are per-zone now

const ICONS_SVG = {
  handlebar:'<path d="M12 2v4M4 10h16M6 10c0 4 2 8 6 8s6-4 6-8"/>',
  fuel:'<path d="M3 22h12M5 22V8l2-4h8l2 4v14"/><path d="M9 12h4"/>',
  wheel:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>',
  engine:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9"/>',
  seat:'<path d="M4 18h16M6 18v-4c0-2 2-4 6-4s6 2 6 4v4"/>',
};

// ═══ STATE ═══
let selectedZone = null;
let styleMode = 0;
let motoModel = null;
let allMeshes = [];
let pickerOpen = false;

// Load saved colors
function loadColors() {
  const saved = localStorage.getItem('ma_v2_colors');
  if (saved) {
    const data = JSON.parse(saved);
    ZONES.forEach(z => { if (data[z.id]) z.color = data[z.id]; });
    if (data.chasis) chasisColor = data.chasis;
  }
}
function saveColors() {
  const data = {};
  ZONES.forEach(z => data[z.id] = z.color);
  data.chasis = chasisColor;
  localStorage.setItem('ma_v2_colors', JSON.stringify(data));
}
loadColors();

// ═══ RENDER ICONS ═══
function renderIcons() {
  const L = document.getElementById('icL');
  const R = document.getElementById('icR');
  L.innerHTML = ''; R.innerHTML = '';

  ZONES.forEach(z => {
    const div = document.createElement('div');
    div.className = 'ic-btn';
    div.onclick = (e) => togglePicker(z.id, e);

    const circle = document.createElement('div');
    circle.className = 'ic-circle' + (selectedZone === z.id ? ' selected' : '');
    circle.style.borderColor = z.color;
    circle.style.color = z.color;
    circle.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">${ICONS_SVG[z.icon]}</svg>`;

    const label = document.createElement('div');
    label.className = 'ic-label';
    label.textContent = z.name;

    div.appendChild(circle);
    div.appendChild(label);
    (z.side === 'left' ? L : R).appendChild(div);
  });
}

// ═══ COLOR PICKER (centered strip) ═══
function togglePicker(zoneId, event) {
  const picker = document.getElementById('picker');
  if (pickerOpen && selectedZone === zoneId) {
    picker.classList.remove('open');
    pickerOpen = false;
    selectedZone = null;
    renderIcons(); paint();
    return;
  }

  selectedZone = zoneId;
  pickerOpen = true;
  renderIcons(); paint();

  const zone = ZONES.find(z => z.id === zoneId);
  const colors = zone ? zone.palette : CHASIS_PALETTE;
  const name = zone ? zone.name : 'Chasis';
  const currentColor = zone ? zone.color : chasisColor;

  picker.innerHTML = `<span class="cp-label">${name}:</span>` +
    colors.map(c => `<div class="cp-color${currentColor===c?' active':''}" style="background:${c}" onclick="pickColor('${zoneId}','${c}')"></div>`).join('') +
    `<div class="cp-close" onclick="closePicker()">✕</div>`;
  picker.classList.add('open');
}

window.pickColor = function(zoneId, color) {
  const zone = ZONES.find(z => z.id === zoneId);
  if (zone) zone.color = color;
  else chasisColor = color;
  // Re-render picker to update active state
  const picker = document.getElementById('picker');
  picker.querySelectorAll('.cp-color').forEach(el => {
    const bg = el.style.background || el.style.backgroundColor;
    el.classList.toggle('active', bg === color);
  });
  renderIcons(); paint();
};

window.closePicker = function() {
  document.getElementById('picker').classList.remove('open');
  pickerOpen = false;
  selectedZone = null;
  renderIcons();
  paint();
};

window.setStyle = function(m) {
  styleMode = m;
  document.getElementById('sbWire').classList.toggle('on', m===0);
  document.getElementById('sbFlat').classList.toggle('on', m===1);
  paint();
};

window.resetAll = function() {
  ZONES.forEach(z => z.color = DEFAULT_COLORS[z.id]);
  chasisColor = DEFAULT_COLORS.chasis;
  renderIcons(); paint();
};

window.saveAndBack = function() {
  saveColors();
  window.location = 'index.html';
};

window.toggleTheme = function() {
  const t = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', t==='dark'?'':'dark');
};

// ═══ PAINT ═══
function inBox(x, y, z, zone) {
  return Math.abs(x-zone.cx)<=zone.w*0.5 && Math.abs(y-zone.cy)<=zone.h*0.5 && Math.abs(z-zone.cz)<=zone.d*0.5;
}
function findZone(x, y, z) {
  for (const z2 of ZONES) { if (inBox(x,y,z,z2)) return z2; }
  return null;
}

function paint() {
  if (!motoModel) return;
  motoModel.traverse(c => {
    if (!c.isMesh) return;
    const geo = c.geometry;
    const pos = geo.attributes.position;
    const count = pos.count;
    c.updateMatrixWorld(true);
    const mat4 = c.matrixWorld;
    const v = new THREE.Vector3();

    let colorAttr = geo.attributes.color;
    if (!colorAttr || colorAttr.count !== count) {
      colorAttr = new THREE.BufferAttribute(new Float32Array(count*3), 3);
      geo.setAttribute('color', colorAttr);
    }

    for (let i=0; i<count; i++) {
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(mat4);
      const zone = findZone(v.x, v.y, v.z);
      const hex = zone ? zone.color : chasisColor;
      const isSel = zone ? (selectedZone===zone.id) : false;
      let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
      if (isSel) { r=Math.min(1,r*1.3+0.1); g=Math.min(1,g*1.3+0.1); b=Math.min(1,b*1.3+0.1); }
      colorAttr.setXYZ(i, r, g, b);
    }
    colorAttr.needsUpdate = true;

    // Remove old wireframes
    const rm=[]; c.children.forEach(ch=>{if(ch.isLineSegments)rm.push(ch)}); rm.forEach(ch=>{c.remove(ch);ch.geometry?.dispose();ch.material?.dispose()});

    if (styleMode===0) {
      c.material = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.6, metalness:0.2, transparent:true, opacity:0.4});
      const wGeo = new THREE.WireframeGeometry(geo);
      const wPos = wGeo.attributes.position;
      const wCount = wPos.count;
      const wColors = new Float32Array(wCount*3);
      for (let i=0; i<wCount; i++) {
        v.set(wPos.getX(i), wPos.getY(i), wPos.getZ(i)).applyMatrix4(mat4);
        const zone = findZone(v.x,v.y,v.z);
        const hex = zone ? zone.color : chasisColor;
        wColors[i*3]=parseInt(hex.slice(1,3),16)/255;
        wColors[i*3+1]=parseInt(hex.slice(3,5),16)/255;
        wColors[i*3+2]=parseInt(hex.slice(5,7),16)/255;
      }
      wGeo.setAttribute('color', new THREE.BufferAttribute(wColors, 3));
      c.add(new THREE.LineSegments(wGeo, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:0.7})));
    } else {
      c.material = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.85, metalness:0.0, flatShading:true});
    }
  });
}

// ═══ THREE.JS ═══
const container = document.getElementById('viewer3d');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe4e7ec);

const camera = new THREE.PerspectiveCamera(45,1,0.01,100);
camera.position.set(1.6, 1.0, 2.4);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.6;
container.appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera,renderer.domElement);
ctrl.enableDamping=true; ctrl.dampingFactor=.08; ctrl.autoRotate=true; ctrl.autoRotateSpeed=1;
ctrl.target.set(0,0.5,0); ctrl.maxDistance=5; ctrl.minDistance=1;

scene.add(new THREE.HemisphereLight(0xffffff,0x88aacc,2));
const kL=new THREE.DirectionalLight(0xffffff,3.5); kL.position.set(4,7,4); kL.castShadow=true; kL.shadow.mapSize.set(1024,1024); scene.add(kL);
scene.add(new THREE.DirectionalLight(0xaabbdd,1.8).translateX(-5).translateY(4).translateZ(-2));
scene.add(new THREE.DirectionalLight(0xffeedd,1.2).translateY(3).translateZ(-6));
scene.add(new THREE.PointLight(0x6688aa,1,6).translateY(-0.5));

const ground=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x1a2a4a,roughness:.85}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

new GLTFLoader().load('base_color.glb', g=>{
  const o=g.scene;
  const box=new THREE.Box3().setFromObject(o); const sz=box.getSize(new THREE.Vector3()); const cn=box.getCenter(new THREE.Vector3());
  o.position.sub(cn); const s=2/Math.max(sz.x,sz.y,sz.z); o.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(o); const s2=b2.getSize(new THREE.Vector3()); const c2=b2.getCenter(new THREE.Vector3());
  o.position.y-=c2.y-s2.y/2;
  o.updateMatrixWorld(true);
  o.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;allMeshes.push(c)}});
  scene.add(o); motoModel=o;
  paint();
  document.getElementById('loading').classList.add('done');
}, xhr=>{if(xhr.total>0)document.getElementById('loadPct').textContent=Math.round(xhr.loaded/xhr.total*100)+'%'},
e=>{document.getElementById('loadPct').textContent='Error';console.error(e)});

// Click on model to select zone
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
renderer.domElement.addEventListener('click', e=>{
  if(!motoModel||pickerOpen) return;
  const rect=renderer.domElement.getBoundingClientRect();
  ptr.x=((e.clientX-rect.left)/rect.width)*2-1;
  ptr.y=-((e.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(ptr, camera);
  const hits=ray.intersectObjects(allMeshes,false);
  if(hits.length>0){
    const pt=hits[0].point;
    const zone=findZone(pt.x,pt.y,pt.z);
    if(zone){selectedZone=zone.id; renderIcons(); paint();}
  }
});

function resize(){const w=container.clientWidth,h=container.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}
window.addEventListener('resize',resize); resize();
(function loop(){requestAnimationFrame(loop);ctrl.update();renderer.render(scene,camera)})();

renderIcons();
</script>
</body>
</html>
